[build-system]
requires = ["setuptools>=70.0", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-speech"
version = "0.1.0"
description = "Text-to-Speech conversion tool"
requires-python = ">=3.9"
dependencies = [
    "flask==3.0.0",
    "pyttsx3==2.90",
    "gtts==2.4.0",
    "PyYAML==6.0.1",
]
